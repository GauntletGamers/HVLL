<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HVLL - Level</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a href="homepage.html" class="logo">
            <img src="HVLL.webp" alt="HVLL">
        </a>

        <nav class="main-nav">

            <a href="homepage.html">
                Home
            </a>

            <a href="levels.html">
                Levels
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="edit-profile.html">
                Edit Profile
            </a>

            <a href="releases.html">
                Releases
            </a>

            <a href="create-account.html" class="account-button">
                Create Account
            </a>

            <a
                href="https://discord.gg/bbJP9rTnj"
                class="social-button"
                target="_blank"
                rel="noopener noreferrer"
            >
                Discord
            </a>

            <a
                href="https://www.youtube.com/@RCSB4771"
                class="social-button"
                target="_blank"
                rel="noopener noreferrer"
            >
                YouTube
            </a>

        </nav>

    </div>

</header>

<main class="level-page">

    <!-- BACK -->

    <a href="levels.html" class="back-button">
        ← Back to Levels
    </a>


    <!-- LEVEL -->

    <section
        id="levelContainer"
        class="level-container"
    >

        <div class="loading-state">
            Loading level...
        </div>

    </section>

</main>


<footer class="site-footer">

    <p>
        HVLL — Hardest Verified Levels List
    </p>

    <p>
        Verified. Ranked. Challenged.
    </p>

</footer>


<script>

/* ==================================================
   LEVEL DATABASE
================================================== */

const levels = {

    "society": {
        rank: 1,
        name: "Society",
        creator: "Neomarbilan",
        verifier: "wPopoff",
        rated: false,
        image: "https://i.ytimg.com/vi/ht7i-nm8k24/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLDfzxIIAfDAxhy7ofzrfMUYuqID8Q",
        description: "One of the hardest levels currently tracked by HVLL."
    },

    "thinking-space-ii": {
        rank: 2,
        name: "Thinking Space II",
        creator: "CairoX",
        verifier: "Zoink",
        rated: false,
        image: "https://i.ytimg.com/vi/xe_Wk_Sy9Pk/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLCsP9vo63llbJdFA55z6pB2uGo7vg",
        description: "Thinking Space II."
    },

    "flamewall": {
        rank: 3,
        name: "Flamewall",
        creator: "UNarwall",
        verifier: "CuatroCientos40",
        rated: false,
        image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJXw4SjhKfKLQwcbEGDKUAnrXYjUlGHpDHeD5nXCu42__ZL95jqPapRqcO&s=10",
        description: "Flamewall."
    },

    "amethyst": {
        rank: 4,
        name: "Amethyst",
        creator: "iMist",
        verifier: "wPopoff",
        rated: false,
        image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTz5ObY0FlniRojUWNCBjqP0pP5nBAUiDQZM2rSEWGpbQ&s=10",
        description: "Amethyst."
    },

    "tidal-wave": {
        rank: 5,
        name: "Tidal Wave",
        creator: "OniLinkGD",
        verifier: "Zoink",
        rated: true,
        image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRC5xmxnd1FXHxgIAfS7R-NKZsePhE_iFS7aZHn_l8Rmg&s=10",
        description: "Tidal Wave."
    },

    "green-bullet": {
        rank: 6,
        name: "Green Bullet",
        creator: "cherryteam",
        verifier: "NiCkNaMe09",
        rated: false,
        image: "https://i.ytimg.com/vi/BTXbb8ccRr0/maxresdefault.jpg",
        description: "Green Bullet."
    },

    "orbit": {
        rank: 7,
        name: "Orbit",
        creator: "MindCap",
        verifier: "Zoink",
        rated: false,
        image: "https://static.wikia.nocookie.net/geometry-dash/images/8/81/I%D0%BA%D0%B2i%D0%BCi%D1%80i%D0%BD.webp/revision/latest/scale-to-width-down/1200?cb=20251219100134&path-prefix=ru",
        description: "Orbit."
    },

    "aquamarine": {
        rank: 8,
        name: "Aquamarine",
        creator: "sincos",
        verifier: "seels55",
        rated: false,
        image: "https://i.ytimg.com/vi/80YeaP2DLvQ/maxresdefault.jpg",
        description: "Aquamarine."
    },

    "nullscapes": {
        rank: 9,
        name: "Nullscapes",
        creator: "ItzKiba",
        verifier: "Zoink",
        rated: false,
        image: "https://i.ytimg.com/vi/C-KDhWkXlvI/maxresdefault.jpg",
        description: "Nullscapes."
    },

    "boobawamba": {
        rank: 10,
        name: "BOOBAWAMBA",
        creator: "Akunakunn",
        verifier: "eastshark",
        rated: false,
        image: "https://static.wikia.nocookie.net/geometry-dash-fan/images/9/97/Boobawamba_06.jpg/revision/latest?cb=20251118230817",
        description: "BOOBAWAMBA."
    }

};


/* ==================================================
   GET LEVEL ID
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const levelId =
    params.get("id");


const container =
    document.getElementById(
        "levelContainer"
    );


/* ==================================================
   LEVEL NOT FOUND
================================================== */

if (
    !levelId ||
    !levels[levelId]
) {

    document.title =
        "HVLL - Level Not Found";


    container.innerHTML = `

        <div class="not-found">

            <div class="not-found-code">
                404
            </div>

            <h1>
                Level Not Found
            </h1>

            <p>
                That level doesn't exist in the HVLL database.
            </p>

            <a
                href="levels.html"
                class="primary-button"
            >
                Return to Levels
            </a>

        </div>

    `;

} else {

    const level =
        levels[levelId];


    /* ==================================================
       PAGE TITLE
    ================================================== */

    document.title =
        `HVLL - ${level.name}`;


    /* ==================================================
       THUMBNAIL
    ================================================== */

    let imageHTML = "";


    if (level.image) {

        imageHTML = `

            <div class="level-hero-image">

                <img
                    src="${level.image}"
                    alt="${level.name} thumbnail"
                    onerror="this.parentElement.innerHTML='<div class=&quot;no-thumbnail&quot;>No thumbnail available</div>'"
                >

            </div>

        `;

    } else {

        imageHTML = `

            <div class="level-hero-image">

                <div class="no-thumbnail">
                    No thumbnail available
                </div>

            </div>

        `;

    }


    /* ==================================================
       RATING
    ================================================== */

    const ratingHTML =
        level.rated

            ? `
                <span class="rating rated">
                    Rated
                </span>
              `

            : `
                <span class="rating unrated">
                    Unrated
                </span>
              `;


    /* ==================================================
       RENDER PAGE
    ================================================== */

    container.innerHTML = `

        ${imageHTML}


        <div class="level-content">

            <div class="level-title-row">

                <div>

                    <div class="level-rank-large">
                        #${level.rank}
                    </div>

                    <h1>
                        ${level.name}
                    </h1>

                </div>

                ${ratingHTML}

            </div>


            <div class="level-details">

                <div class="detail">

                    <span class="detail-label">
                        Creator
                    </span>

                    <strong>
                        ${level.creator}
                    </strong>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        Verifier
                    </span>

                    <strong>
                        ${level.verifier}
                    </strong>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        HVLL Rank
                    </span>

                    <strong>
                        #${level.rank}
                    </strong>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        Rating
                    </span>

                    <strong>
                        ${level.rated ? "Rated" : "Unrated"}
                    </strong>

                </div>

            </div>


            <div class="level-description">

                <h2>
                    About
                </h2>

                <p>
                    ${level.description}
                </p>

            </div>

        </div>

    `;

}

</script>


<style>

/* ==================================================
   LEVEL PAGE
================================================== */

.level-page {
    width: min(1050px, calc(100% - 40px));

    margin: 0 auto;

    padding: 55px 0 100px;
}


/* ==================================================
   BACK BUTTON
================================================== */

.back-button {
    display: inline-block;

    margin-bottom: 25px;

    color: #88888f;

    font-size: 14px;
    font-weight: 700;

    transition:
        color 0.2s ease;
}

.back-button:hover {
    color: #ffffff;
}


/* ==================================================
   CONTAINER
================================================== */

.level-container {
    overflow: hidden;

    background: #111113;

    border: 1px solid #242428;

    border-radius: 8px;
}


/* ==================================================
   HERO IMAGE
================================================== */

.level-hero-image {
    width: 100%;
    height: 430px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #080809;
}

.level-hero-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.no-thumbnail {
    color: #55555b;

    font-family: "Berthold Block", Arial, sans-serif;

    font-size: 24px;

    text-transform: uppercase;
}


/* ==================================================
   CONTENT
================================================== */

.level-content {
    padding: 35px;
}

.level-title-row {
    display: flex;

    align-items: flex-start;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 35px;
}

.level-rank-large {
    margin-bottom: 5px;

    color: #ffd500;

    font-family: "Berthold Block", Arial, sans-serif;

    font-size: 22px;
}

.level-title-row h1 {
    margin: 0;

    color: #ffffff;

    font-family: "Berthold Block", Arial, sans-serif;

    font-size: 52px;

    line-height: 1;
}


/* ==================================================
   RATING
================================================== */

.rating {
    padding: 8px 12px;

    border-radius: 5px;

    font-size: 12px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 0.5px;

    white-space: nowrap;
}

.rating.rated {
    color: #7fe69a;

    background: #102519;

    border: 1px solid #285b38;
}

.rating.unrated {
    color: #ffd500;

    background: #211e0c;

    border: 1px solid #4d461c;
}


/* ==================================================
   DETAILS
================================================== */

.level-details {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 40px;
}

.detail {
    padding: 18px;

    background: #080809;

    border: 1px solid #242428;

    border-radius: 6px;
}

.detail-label {
    display: block;

    margin-bottom: 7px;

    color: #69696f;

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.5px;
}

.detail strong {
    color: #ffffff;

    font-size: 14px;
}


/* ==================================================
   DESCRIPTION
================================================== */

.level-description {
    padding-top: 30px;

    border-top: 1px solid #242428;
}

.level-description h2 {
    margin: 0 0 12px;

    color: #ffffff;

    font-family: "Berthold Block", Arial, sans-serif;

    font-size: 28px;
}

.level-description p {
    margin: 0;

    color: #8a8a90;

    font-size: 15px;

    line-height: 1.7;
}


/* ==================================================
   404
================================================== */

.not-found {
    padding: 80px 30px;

    text-align: center;
}

.not-found-code {
    margin-bottom: 10px;

    color: #ffd500;

    font-family: "Berthold Block", Arial, sans-serif;

    font-size: 80px;

    line-height: 1;
}

.not-found h1 {
    margin: 0 0 10px;

    color: #ffffff;

    font-family: "Berthold Block", Arial, sans-serif;

    font-size: 35px;
}

.not-found p {
    margin: 0 0 25px;

    color: #77777d;
}

.primary-button {
    display: inline-block;

    padding: 11px 18px;

    background: #ffd500;

    color: #080809;

    border-radius: 5px;

    font-size: 13px;

    font-weight: 800;
}


/* ==================================================
   LOADING
================================================== */

.loading-state {
    padding: 80px;

    text-align: center;

    color: #77777d;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 750px) {

    .level-page {
        width: calc(100% - 24px);

        padding-top: 40px;
    }

    .level-hero-image {
        height: 280px;
    }

    .level-content {
        padding: 25px;
    }

    .level-title-row h1 {
        font-size: 40px;
    }

    .level-details {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media (max-width: 500px) {

    .level-hero-image {
        height: 210px;
    }

    .level-title-row {
        flex-direction: column;
    }

    .level-title-row h1 {
        font-size: 34px;
    }

    .level-details {
        grid-template-columns:
            1fr;
    }

}

</style>

</body>
</html>
